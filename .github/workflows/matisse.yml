name: matisse UEFI build

on:
  push:
    branches: [ "wp" ]
  pull_request:
    branches: [ "wp" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
    - name: CI Build
      run: chmod +x ci-build-matisse.sh && ./ci-build-matisse.sh

    - uses: actions/upload-artifact@v6
      with:
        name: Galaxy Tab 4
        path: ./workspace/bootpayload.bin
