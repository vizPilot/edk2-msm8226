name: C/C++ CI RELEASE

on:
  push:
    branches: [ "wp" ]
  pull_request:
    branches: [ "wp" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
    - name: CI Build
      run: chmod +x ci-build.sh && ./ci-build.sh

    - uses: actions/upload-artifact@v6
      with:
        name: Galaxy S5 Mini Duos
        path: ./workspace/boot.img-kernel
